#https://packaging.python.org/en/latest/tutorials/packaging-projects/
[project]
name = "CAPcore-python"
version = "0.2.3.4"
authors = [
    { name="Example Author", email="author@example.com" },
]
description = "Support functions for CAP projects"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "lxml>=6.0.2",
    "requests>=2.32.5",
    "MechanicalSoup>=1.4.0",
    "python-dateutil>=2.9.0.post0",
    "PyYAML>=6.0.2",
    "urllib3>=2.6.2"
]
classifiers = [
    "License :: CAP license",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
